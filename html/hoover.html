<!DOCTYPE html>
<html>
<head>
  <style>
    /* Button styling */
    .hover-btn {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      transition: 0.3s; /* smooth effect */
      cursor: pointer;
    }

    /* Hover effect */
    .hover-btn:hover {
      background-color: #45a049; /* darker green */
      transform: scale(1.1);     /* zoom in */
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); /* shadow */
    }
  </style>
</head>
<body>

<h2>Hover Effect Demo</h2>
<button class="hover-btn">Hover Me</button>

</body>
</html>
