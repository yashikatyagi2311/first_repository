<!DOCTYPE html>
<html>
<head>
  <style>
    table {
      border-collapse: collapse;
      width: 80%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #444;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #333;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    caption {
      font-size: 1.5em;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<table>
  <caption>Company Employee Report</caption>
  <thead>
    <tr>
      <th rowspan="2">Department</th>
      <th rowspan="2">Employee</th>
      <th colspan="2">Performance</th>
      <th rowspan="2">Remarks</th>
    </tr>
    <tr>
      <th>Q1</th>
      <th>Q2</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td rowspan="2">IT</td>
      <td>Aryan</td>
      <td>Excellent</td>
      <td>Good</td>
      <td rowspan="2">Promoted</td>
    </tr>
    <tr>
      <td>Priya</td>
      <td>Good</td>
      <td>Excellent</td>
    </tr>
    <tr>
      <td rowspan="2">HR</td>
      <td>Rahul</td>
      <td>Average</td>
      <td>Good</td>
      <td rowspan="2">Needs Training</td>
    </tr>
    <tr>
      <td>Neha</td>
      <td>Good</td>
      <td>Average</td>
    </tr>
  </tbody>
</table>

</body>
</html>
