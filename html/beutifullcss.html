<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Webpage</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #74ebd5, #ACB6E5);
      color: #333;
    }

    header {
      background: rgba(255, 255, 255, 0.8);
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #2c3e50;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      color: #2c3e50;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #e74c3c;
    }

    section {
      padding: 50px;
      text-align: center;
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      max-width: 600px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    footer {
      background: rgba(255, 255, 255, 0.8);
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Beautiful Page</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Gallery</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section>
    <h2>Featured Content</h2>
    <div class="card">
      <p>This is a simple card with a shadow and hover effect. You can add text, images, or buttons here to make your webpage interactive and visually appealing.</p>
    </div>
  </section>

  <footer>
    &copy; 2026 My Beautiful Webpage. All rights reserved.
  </footer>
</body>
</html>
